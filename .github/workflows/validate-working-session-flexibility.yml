name: Validate working session flexibility

on:
  push:
    branches:
      - agent/restore-working-session-flexibility
    paths:
      - .github/workflows/validate-working-session-flexibility.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-working-session-flexibility
          fetch-depth: 0

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"

      - name: Validate architecture and Swift 6 build
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh

      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-working-session-flexibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-working-session-flexibility.yml
          git commit -m "Remove temporary flexibility validation"
          git push origin HEAD:agent/restore-working-session-flexibility
