name: Correct global animal query

on:
  push:
    branches:
      - agent/global-animal-query
    paths:
      - .github/workflows/correct-global-animal-query.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/global-animal-query
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore in-place query behavior and original navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              content = read(path)
              actual = content.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:100]!r}")
              write(path, content.replace(old, new, count))

          navigation_path = "yaHerd/App/Navigation/AppNavigationState.swift"
          replace_exact(
              navigation_path,
              "    case pastureGroups\n    case fieldCheckSetup(UUID)\n",
              "    case pastureGroups\n"
          )
          replace_exact(
              navigation_path,
              "        animalQuery.clearCriteria()\n        animalQuery.showingFilters = false\n        isSearchPresented = false\n        pastureFilter = configuration.filter\n",
              "        pastureFilter = configuration.filter\n"
          )
          replace_exact(
              navigation_path,
              "    func showSearch(query: String = \"\") {\n        searchPath.removeAll()\n        mode = .animals\n        searchText = query\n        isSearchPresented = true\n    }",
              "    func showSearch(query: String = \"\") {\n        searchText = query\n        isSearchPresented = true\n    }"
          )
          replace_exact(
              navigation_path,
              "        selectedTab = snapshot.selectedTab\n",
              "        selectedTab = snapshot.selectedTab == .search ? .herd : snapshot.selectedTab\n"
          )
          replace_exact(
              navigation_path,
              "    func openPasture(_ pastureID: UUID) {\n        selectedTab = .herd\n        herdRouter.clearAnimalCriteria()\n        herdRouter.showingFilters = false\n        herdRouter.isSearchPresented = false\n        herdRouter.openPasture(pastureID)\n    }",
              "    func openPasture(_ pastureID: UUID) {\n        selectedTab = .herd\n        herdRouter.openPasture(pastureID)\n    }"
          )
          replace_exact(
              navigation_path,
              "    func selectSearchTab() {\n        selectedTab = .search\n        herdRouter.isSearchPresented = true\n    }",
              "    func selectSearchTab() {\n        selectedTab = .herd\n        herdRouter.isSearchPresented = true\n    }"
          )
          replace_exact(
              navigation_path,
              "    func openSearch(query: String = \"\") {\n        selectedTab = .search\n        herdRouter.showSearch(query: query)\n    }",
              "    func openSearch(query: String = \"\") {\n        selectedTab = .herd\n        herdRouter.showSearch(query: query)\n    }"
          )

          main_tab_path = "yaHerd/Presentation/Views/Navigation/MainTabView.swift"
          main_tab = read(main_tab_path)
          search_tab = '''

            Tab("Search", systemImage: "magnifyingglass", value: AppTab.search, role: .search) {
                HerdTabRootView(tab: .search)
            }
          '''
          if search_tab not in main_tab:
              raise SystemExit("MainTabView: search tab block not found")
          main_tab = main_tab.replace(search_tab, "", 1)
          main_tab = main_tab.replace(
              '''        .yaherdTabViewBottomAccessory(isVisible: showsAnimalQueryAccessory) {
            HerdTabBottomAccessory()
        }''',
              '''        .tabViewBottomAccessory {
            if showsAnimalQueryAccessory {
                HerdTabBottomAccessory()
            }
        }''',
              1
          )
          main_tab = main_tab.replace(
              '''        guard navigation.selectedTab == .herd || navigation.selectedTab == .search else {
            return false
        }
''',
              '''        guard navigation.selectedTab == .herd else {
            return false
        }
''',
              1
          )
          main_tab = re.sub(
              r'''\n    @ViewBuilder\n    func yaherdTabViewBottomAccessory<Accessory: View>\(\n        isVisible: Bool,\n        @ViewBuilder accessory: \(\) -> Accessory\n    \) -> some View \{\n        if isVisible \{\n            tabViewBottomAccessory \{\n                accessory\(\)\n            \}\n        \} else \{\n            self\n        \}\n    \}\n''',
              "\n",
              main_tab,
              count=1
          )
          write(main_tab_path, main_tab)

          herd_root = textwrap.dedent('''\
          import SwiftUI

          struct HerdTabRootView: View {
              let tab: AppTab

              @Environment(AppNavigationState.self) private var navigation

              init(tab: AppTab = .herd) {
                  self.tab = tab
              }

              private var router: HerdRouter { navigation.herdRouter }
              private var query: AnimalQueryState { navigation.animalQuery }

              var body: some View {
                  @Bindable var query = query
                  @Bindable var router = router

                  if showsAnimalQueryControls {
                      herdNavigationStack
                          .searchable(
                              text: $query.searchText,
                              isPresented: $router.isSearchPresented,
                              prompt: "Search tag, visual ID, or name"
                          )
                  } else {
                      herdNavigationStack
                  }
              }

              private var herdNavigationStack: some View {
                  NavigationStack(path: navigationPathBinding) {
                      herdContent
                          .navigationDestination(for: HerdRoute.self) { route in
                              destination(route)
                          }
                  }
              }

              private var herdContent: some View {
                  @Bindable var router = router
                  @Bindable var query = query

                  return HerdView(
                      searchText: $query.searchText,
                      isSearchPresented: searchPresentationBinding,
                      mode: $router.mode,
                      sortOrder: $query.sortOrder,
                      filter: $query.filter,
                      showRemovedStatuses: $query.showRemovedStatuses,
                      showArchivedRecords: $query.showArchivedRecords,
                      showingFilters: $query.showingFilters,
                      pastureFilter: $router.pastureFilter,
                      usesShellBottomAccessory: true,
                      onOpenAnimal: { router.openAnimal($0, in: tab) },
                      onOpenPasture: { router.openPasture($0, in: tab) },
                      onOpenFieldChecks: { router.openFieldChecks(.all, in: tab) },
                      onOpenWorkSessions: { router.openWorkingSessions(in: tab) },
                      onOpenSettings: { navigation.present(.settings) }
                  )
              }

              private var navigationPathBinding: Binding<[HerdRoute]> {
                  Binding {
                      router.path(for: tab)
                  } set: { newPath in
                      router.setPath(newPath, for: tab)
                  }
              }

              private var searchPresentationBinding: Binding<Bool> {
                  Binding {
                      router.isSearchPresented
                  } set: { isPresented in
                      router.isSearchPresented = isPresented
                  }
              }

              private var showsAnimalQueryControls: Bool {
                  guard navigation.selectedTab == .herd else { return false }
                  guard let destination = router.path(for: tab).last else { return true }

                  if case .pasture = destination {
                      return true
                  }

                  return false
              }

              @ViewBuilder
              private func destination(_ route: HerdRoute) -> some View {
                  switch route {
                  case .animal(let animalID):
                      AnimalDetailView(animalID: animalID)
                  case .pasture(let pastureID):
                      PastureDetailView(pastureID: pastureID)
                  case .pastureGroups:
                      PastureGroupListView()
                  case .fieldChecks(let mode):
                      FieldChecksView(mode: mode, onSessionLaunch: { configuration in
                          navigation.openFieldCheckArea(.session(configuration))
                      })
                  case .workingSessions:
                      WorkingSessionsView { sessionID in
                          navigation.openWorkArea(.session(sessionID))
                      }
                  }
              }
          }

          struct HerdTabBottomAccessory: View {
              @Environment(AppNavigationState.self) private var navigation

              private var query: AnimalQueryState { navigation.animalQuery }

              var body: some View {
                  @Bindable var query = query

                  PersistentAnimalQueryControls(
                      sortOrder: $query.sortOrder,
                      filtersAreActive: query.filtersAreActive,
                      activeFilterCount: query.activeFilterCount,
                      hasAnyActiveCriteria: query.hasAnyActiveCriteria,
                      onShowFilters: { query.showingFilters = true },
                      onClearAllCriteria: { query.clearCriteria() }
                  )
              }
          }
          ''')
          write("yaHerd/Presentation/Views/Navigation/HerdTabRootView.swift", herd_root)

          pasture_detail_path = "yaHerd/Presentation/Views/Pasture/PastureDetailView.swift"
          replace_exact(
              pasture_detail_path,
              '''                NavigationLink(value: HerdRoute.fieldCheckSetup(detail.id)) {
                    Label("Start Pasture Check", systemImage: "checklist")
                }
''',
              '''                NavigationLink {
                    FieldCheckSessionSetupView(suggestedPastureID: detail.id) { sessionID in
                        navigation.openFieldCheckArea(
                            .session(FieldCheckSessionLaunchConfiguration(sessionID: sessionID))
                        )
                    }
                    .toolbarVisibility(.hidden, for: .tabBar)
                } label: {
                    Label("Start Pasture Check", systemImage: "checklist")
                }
'''
          )

          controls_path = Path("yaHerd/Presentation/Support/AnimalQuery/PersistentAnimalQueryControls.swift")
          controls_path.write_text(textwrap.dedent('''\
          import SwiftUI

          struct PersistentAnimalQueryControls: View {
              @Binding var sortOrder: AnimalSortOrder
              let filtersAreActive: Bool
              let activeFilterCount: Int
              let hasAnyActiveCriteria: Bool
              let onShowFilters: () -> Void
              let onClearAllCriteria: () -> Void

              var body: some View {
                  HStack(spacing: 12) {
                      Menu {
                          Picker("Sort", selection: $sortOrder) {
                              ForEach(AnimalSortOrder.allCases, id: \\.self) { option in
                                  Label(option.label, systemImage: option.menuIcon)
                                      .tag(option)
                              }
                          }
                      } label: {
                          Label(sortOrder.menuLabel, systemImage: "arrow.up.arrow.down")
                              .lineLimit(1)
                      }
                      .accessibilityLabel("Sort animals")
                      .accessibilityValue(sortOrder.label)

                      Spacer(minLength: 0)

                      Button(action: onShowFilters) {
                          HStack(spacing: 6) {
                              Label("Filters", systemImage: filtersAreActive ? "line.3.horizontal.decrease.circle.fill" : "line.3.horizontal.decrease.circle")
                              if activeFilterCount > 0 {
                                  Text(activeFilterCount, format: .number)
                                      .font(.caption2.bold())
                                      .monospacedDigit()
                              }
                          }
                      }
                      .accessibilityLabel(activeFilterCount > 0 ? "Filters, \\(activeFilterCount) active" : "Filters")

                      if hasAnyActiveCriteria {
                          Button("Clear", systemImage: "xmark.circle", action: onClearAllCriteria)
                              .accessibilityLabel("Clear search, filters, and visibility options")
                      }
                  }
                  .padding(.horizontal, 16)
                  .padding(.vertical, 10)
              }
          }
          '''))

          for path in Path("yaHerd").rglob("*.swift"):
              content = path.read_text()
              if "AnimalListAdaptiveTabAccessoryControls(" not in content:
                  continue
              if "struct AnimalListAdaptiveTabAccessoryControls" in content:
                  continue
              path.write_text(content.replace(
                  "AnimalListAdaptiveTabAccessoryControls(",
                  "PersistentAnimalQueryControls("
              ))

          engine_path = "yaHerd/Presentation/Support/AnimalQuery/AnimalQueryEngine.swift"
          replace_exact(
              engine_path,
              '''                || $0.name.localizedCaseInsensitiveContains(searchText)
                || ($0.pastureName?.localizedCaseInsensitiveContains(searchText) ?? false)
''',
              '''                || $0.name.localizedCaseInsensitiveContains(searchText)
                || ($0.firstDistinguishingFeature?.localizedCaseInsensitiveContains(searchText) ?? false)
                || ($0.pastureName?.localizedCaseInsensitiveContains(searchText) ?? false)
'''
          )
          replace_exact(
              engine_path,
              "            return tieBreaker?(lhs, rhs) ?? false\n",
              "            return tieBreaker?(lhs, rhs) ?? lhs.id.uuidString < rhs.id.uuidString\n"
          )

          parent_vm = textwrap.dedent('''\
          import Foundation
          import Observation

          @MainActor
          @Observable
          final class AnimalParentPickerViewModel {
              private(set) var items: [AnimalSummary] = []
              var showAllSexes = false
              var errorMessage: String?

              func load(
                  excluding excludedAnimalID: UUID?,
                  using repository: any AnimalListRepository
              ) {
                  do {
                      items = try repository.fetchAnimals().filter { $0.id != excludedAnimalID }
                  } catch {
                      errorMessage = UserVisibleErrorMessage.make(error)
                  }
              }

              func filtered(
                  query: AnimalQuery,
                  suggestedSexes: Set<Sex>,
                  formattedTag: (String, UUID?) -> String
              ) -> [AnimalSummary] {
                  let hasSuggested = items.contains { suggestedSexes.contains($0.sex) }

                  return AnimalQueryEngine.apply(
                      to: items,
                      query: query,
                      mandatoryConstraint: { animal in
                          showAllSexes || !hasSuggested || suggestedSexes.contains(animal.sex)
                      },
                      formatTag: formattedTag
                  )
              }
          }
          ''')
          write("yaHerd/Presentation/ViewModels/Animal/AnimalParentPickerViewModel.swift", parent_vm)

          parent_view = textwrap.dedent('''\
          //
          //  AnimalParentPickerView.swift
          //  yaHerd
          //
          //  Created by mm on 12/31/25.
          //

          import SwiftUI

          struct AnimalParentPickerView: View {
              @Environment(\\.dismiss) private var dismiss
              @Environment(\\.animalFeatureDependencies) private var animalDependencies
              @Environment(AppNavigationState.self) private var navigation
              @EnvironmentObject private var tagColorLibrary: TagColorLibraryStore

              @State private var viewModel = AnimalParentPickerViewModel()
              @State private var pastureOptions: [PastureOption] = []
              @State private var showingQueryFilters = false

              let title: String
              let excludeAnimalID: UUID?
              let suggestedSexes: Set<Sex>
              let onSelect: (AnimalParentOption) -> Void

              private var query: AnimalQueryState { navigation.animalQuery }
              private var repository: any AnimalListRepository { animalDependencies.listRepository }
              private var pastureReferenceReader: any PastureReferenceDataReader { animalDependencies.pastureReferenceReader }

              private var filtered: [AnimalSummary] {
                  viewModel.filtered(
                      query: query.query,
                      suggestedSexes: suggestedSexes,
                      formattedTag: tagColorLibrary.formattedTag(tagNumber:colorID:)
                  )
              }

              var body: some View {
                  @Bindable var query = query

                  NavigationStack {
                      List {
                          Section {
                              Toggle("Show all", isOn: Binding(
                                  get: { viewModel.showAllSexes },
                                  set: { viewModel.showAllSexes = $0 }
                              ))
                          }

                          Section {
                              if filtered.isEmpty {
                                  Text("No animals found")
                                      .foregroundStyle(.secondary)
                              } else {
                                  ForEach(filtered) { animal in
                                      Button {
                                          onSelect(
                                              AnimalParentOption(
                                                  id: animal.id,
                                                  name: animal.name,
                                                  displayTagNumber: animal.displayTagNumber,
                                                  displayTagColorID: animal.displayTagColorID,
                                                  sex: animal.sex,
                                                  isArchived: animal.isArchived
                                              )
                                          )
                                          dismiss()
                                      } label: {
                                          HStack(spacing: 10) {
                                              let definition = tagColorLibrary.resolvedDefinition(tagColorID: animal.displayTagColorID)
                                              VStack(alignment: .leading, spacing: 6) {
                                                  AnimalTagView(
                                                      tagNumber: animal.displayTagNumber,
                                                      color: definition.color,
                                                      colorName: definition.name
                                                  )

                                                  if !animal.name.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                                                      Text(animal.name)
                                                          .font(.subheadline.weight(.semibold))
                                                          .foregroundStyle(.primary)
                                                  }

                                                  Text(animal.sex.label)
                                                      .font(.caption)
                                                      .foregroundStyle(.secondary)
                                              }
                                              Spacer()
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      .navigationTitle(title)
                      .navigationBarTitleDisplayMode(.inline)
                      .searchable(text: $query.searchText, prompt: "Search tag, visual ID, or name")
                      .safeAreaInset(edge: .bottom, spacing: 0) {
                          PersistentAnimalQueryControls(
                              sortOrder: $query.sortOrder,
                              filtersAreActive: query.filtersAreActive,
                              activeFilterCount: query.activeFilterCount,
                              hasAnyActiveCriteria: query.hasAnyActiveCriteria,
                              onShowFilters: { showingQueryFilters = true },
                              onClearAllCriteria: { query.clearCriteria() }
                          )
                          .background(.bar)
                      }
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) {
                              ToolbarCancelButton { dismiss() }
                          }
                      }
                      .sheet(isPresented: $showingQueryFilters) {
                          AnimalFilterView(
                              filter: $query.filter,
                              showRemovedStatuses: $query.showRemovedStatuses,
                              showArchivedRecords: $query.showArchivedRecords,
                              pastureOptions: pastureOptions
                          )
                      }
                  }
                  .task {
                      viewModel.load(excluding: excludeAnimalID, using: repository)
                      pastureOptions = (try? pastureReferenceReader.fetchPastureOptions()) ?? []
                  }
              }
          }
          ''')
          write("yaHerd/Presentation/Views/Animal/Detail/AnimalParentPickerView.swift", parent_view)

          navigation_tests = textwrap.dedent('''\
          import XCTest
          @testable import yaHerd

          @MainActor
          final class AnimalQueryNavigationTests: XCTestCase {
              func testLegacySearchSelectionOpensSearchInPlace() {
                  let navigation = AppNavigationState()
                  let pastureID = UUID()
                  navigation.herdRouter.mode = .pastures
                  navigation.herdRouter.path = [.pasture(pastureID)]

                  navigation.openSearch(query: "W345")

                  XCTAssertEqual(navigation.selectedTab, .herd)
                  XCTAssertEqual(navigation.herdRouter.mode, .pastures)
                  XCTAssertEqual(navigation.herdRouter.path, [.pasture(pastureID)])
                  XCTAssertEqual(navigation.animalQuery.searchText, "W345")
                  XCTAssertTrue(navigation.herdRouter.isSearchPresented)
              }

              func testPastureListLaunchPreservesAnimalCriteria() {
                  let navigation = AppNavigationState()
                  navigation.animalQuery.searchText = "W345"
                  navigation.animalQuery.filter = AnimalFilter(sex: .female)
                  navigation.animalQuery.sortOrder = .sex
                  navigation.animalQuery.showRemovedStatuses = true
                  navigation.animalQuery.showArchivedRecords = true

                  navigation.openPastureList(.rotationReady)

                  XCTAssertEqual(navigation.selectedTab, .herd)
                  XCTAssertEqual(navigation.herdRouter.mode, .pastures)
                  XCTAssertEqual(navigation.herdRouter.pastureFilter, .rotationReady)
                  XCTAssertEqual(navigation.animalQuery.searchText, "W345")
                  XCTAssertEqual(navigation.animalQuery.filter.sex, .female)
                  XCTAssertTrue(navigation.animalQuery.showRemovedStatuses)
                  XCTAssertTrue(navigation.animalQuery.showArchivedRecords)
                  XCTAssertEqual(navigation.animalQuery.sortOrder, .sex)
              }

              func testDirectPastureLaunchPreservesAnimalCriteria() {
                  let navigation = AppNavigationState()
                  let pastureID = UUID()
                  navigation.animalQuery.searchText = "W345"
                  navigation.animalQuery.filter = AnimalFilter(sex: .female)
                  navigation.animalQuery.sortOrder = .sex
                  navigation.animalQuery.showRemovedStatuses = true
                  navigation.animalQuery.showArchivedRecords = true

                  navigation.openPasture(pastureID)

                  XCTAssertEqual(navigation.selectedTab, .herd)
                  XCTAssertEqual(navigation.herdRouter.mode, .pastures)
                  XCTAssertEqual(navigation.herdRouter.path, [.pasture(pastureID)])
                  XCTAssertEqual(navigation.animalQuery.searchText, "W345")
                  XCTAssertEqual(navigation.animalQuery.filter.sex, .female)
                  XCTAssertTrue(navigation.animalQuery.showRemovedStatuses)
                  XCTAssertTrue(navigation.animalQuery.showArchivedRecords)
                  XCTAssertEqual(navigation.animalQuery.sortOrder, .sex)
              }
          }
          ''')
          write("yaHerdTests/AnimalQueryNavigationTests.swift", navigation_tests)

          correction_tests = textwrap.dedent('''\
          import XCTest
          @testable import yaHerd

          final class AnimalQueryCorrectionTests: XCTestCase {
              func testSearchMatchesVisualIdentifier() {
                  let animal = makeAnimal(
                      id: UUID(),
                      tagNumber: "101",
                      name: "",
                      visualIdentifier: "white blaze"
                  )

                  let result = AnimalQueryEngine.apply(
                      to: [animal],
                      query: AnimalQuery(searchText: " BLAZE "),
                      formatTag: { number, _ in number }
                  )

                  XCTAssertEqual(result.map(\\.id), [animal.id])
              }

              func testEqualSortKeysUseStableAnimalIDTieBreaker() {
                  let firstID = UUID(uuidString: "00000000-0000-0000-0000-000000000001")!
                  let secondID = UUID(uuidString: "00000000-0000-0000-0000-000000000002")!
                  let second = makeAnimal(id: secondID, tagNumber: "10", name: "", visualIdentifier: nil)
                  let first = makeAnimal(id: firstID, tagNumber: "10", name: "", visualIdentifier: nil)

                  let result = AnimalQueryEngine.apply(
                      to: [second, first],
                      query: AnimalQuery(sortOrder: .tagAscending),
                      formatTag: { number, _ in number }
                  )

                  XCTAssertEqual(result.map(\\.id), [firstID, secondID])
              }

              private func makeAnimal(
                  id: UUID,
                  tagNumber: String,
                  name: String,
                  visualIdentifier: String?
              ) -> AnimalSummary {
                  AnimalSummary(
                      id: id,
                      name: name,
                      displayTagNumber: tagNumber,
                      displayTagColorID: nil,
                      damDisplayTagNumber: nil,
                      damDisplayTagColorID: nil,
                      sex: .female,
                      animalType: .cow,
                      firstDistinguishingFeature: visualIdentifier,
                      birthDate: Date(timeIntervalSince1970: 0),
                      status: .active,
                      isArchived: false,
                      pastureID: UUID(),
                      pastureName: "North",
                      location: .pasture
                  )
              }
          }
          ''')
          write("yaHerdTests/AnimalQueryCorrectionTests.swift", correction_tests)

          print("Updated query-control call sites:")
          for path in sorted(Path("yaHerd").rglob("*.swift")):
              content = path.read_text()
              if "PersistentAnimalQueryControls(" in content:
                  print(path)
          PY

      - name: Validate architecture and Swift 6 build
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh

      - name: Commit corrected implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/correct-global-animal-query.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct persistent in-place animal query controls"
          git push origin HEAD:agent/global-animal-query
