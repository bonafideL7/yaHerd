name: Apply dose conflict restoration

on:
  pull_request:
    branches:
      - agent/rework-working-session-setup

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-conflict-dose-restore-v2
          fetch-depth: 0
      - name: Apply focused fix
        run: python3 Scripts/apply-dose-conflict-restore-fix.py
      - name: Validate
        run: |
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh
      - name: Commit validated source changes
        run: |
          rm Scripts/apply-dose-conflict-restore-fix.py
          rm .github/workflows/apply-dose-conflict-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            yaHerd/Data/Sharing/CoreData/HerdSharingCoreDataStore+Restoration.swift \
            yaHerd/Domain/Entities/Herd/HerdSharingConflictReview.swift \
            yaHerdTests/HerdSharingConflictReviewTests.swift \
            yaHerdTests/HerdSharingTreatmentDoseModelTests.swift \
            Scripts/apply-dose-conflict-restore-fix.py \
            .github/workflows/apply-dose-conflict-restore.yml
          git commit -m "Restore structured treatment doses from conflicts"
          git push origin HEAD:agent/review-conflict-dose-restore-v2
