name: Swift 6 Concurrency

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  strict-concurrency:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q --force FETCH_HEAD

      - name: Validate architecture and Swift 6 build
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required for the iOS 26 target and Swift 6 concurrency gate." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh

      - name: Collect persistence test diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .build/PersistenceDiagnostics
          if [[ -d .build/PersistenceTests.xcresult ]]; then
            cp -R .build/PersistenceTests.xcresult .build/PersistenceDiagnostics/
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -type f \
            \( -name 'yaHerd*.ips' -o -name 'yaHerd*.crash' -o -name 'xctest*.ips' -o -name 'xctest*.crash' \) \
            -mmin -30 -exec cp {} .build/PersistenceDiagnostics/ \; || true

      - name: Upload persistence test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-test-diagnostics
          path: .build/PersistenceDiagnostics
          retention-days: 3
          if-no-files-found: warn

  merge-main:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/global-animal-query'
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/global-animal-query

      - name: Resolve, validate, and push main merge
        shell: bash
        run: bash .github/scripts/merge-main-global-query.sh
