name: yaHerd Verification

run-name: >-
  Verification · ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      run_architecture:
        description: Run repository architecture checks
        required: true
        type: boolean
        default: true
      run_concurrency:
        description: Run Swift 6 concurrency checks
        required: true
        type: boolean
        default: true
      run_tests:
        description: Run iOS Simulator automated tests
        required: true
        type: boolean
        default: true
      full_verification:
        description: Also run Release, build-for-testing, and device builds
        required: true
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: yaherd-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Validate verification selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.run_architecture }}" != "true" && "${{ inputs.run_concurrency }}" != "true" && "${{ inputs.run_tests }}" != "true" ]]; then
            echo "Select at least one verification option." >&2
            exit 1
          fi

      - name: Check out exact verification commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TARGET_REF="refs/heads/${GITHUB_HEAD_REF}"
          else
            TARGET_REF="${GITHUB_REF}"
          fi

          git -c protocol.version=2 fetch -q --no-tags --depth=1 origin "${TARGET_REF}"
          git checkout -q --force FETCH_HEAD

          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Verifying commit ${ACTUAL_SHA} from ${TARGET_REF}"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Checked-out commit ${ACTUAL_SHA} does not match expected verification commit ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Verify privacy manifest
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-privacy.sh

      - name: Select Xcode 26
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_concurrency || inputs.run_tests }}
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required for the iOS 26 target and Swift 6 verification." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version

      - name: Verify architecture
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_architecture }}
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-architecture.sh

      - name: Verify Swift 6 concurrency
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_concurrency }}
        shell: bash
        env:
          YAHERD_FULL_VERIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.full_verification && '1' || '0' }}
          YAHERD_TESTS_BUILD_APP: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_tests) && '1' || '0' }}
        run: |
          set -euo pipefail
          bash Scripts/verify-concurrency.sh

      - name: Run iOS Simulator tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        shell: bash
        run: |
          set -euo pipefail

          # Discover an installed iOS 26 iPhone simulator on the runner.
          SIMULATOR_ID="$(xcrun simctl list -j devices available | python3 -c '
          import json
          import sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime, entries in devices.items():
              if "SimRuntime.iOS-26" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          ')"

          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "An available iOS 26 iPhone simulator is required to run yaHerdTests." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "Running yaHerdTests on simulator $SIMULATOR_ID"
          xcodebuild \
            -project yaHerd.xcodeproj \
            -scheme yaHerd \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/ConcurrencyDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
