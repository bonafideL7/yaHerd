name: Swift 6 Concurrency

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  strict-concurrency:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q --force FETCH_HEAD

      - name: Validate architecture and Swift 6 build
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required for the iOS 26 target and Swift 6 concurrency gate." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh

      - name: Package source snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/yaherd-source.tar.gz --exclude=.git .

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaherd-source-${{ github.run_id }}
          path: /tmp/yaherd-source.tar.gz
          retention-days: 1
