name: Run global query correction

on:
  push:
    branches:
      - agent/global-animal-query
    paths:
      - .github/workflows/run-query-correction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/global-animal-query
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the staged correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/correct-global-animal-query.yml')
          workflow = workflow_path.read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, str(workflow_path), 'exec'))
          PY

      - name: Commit corrected implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/correct-global-animal-query.yml
          rm .github/workflows/run-query-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct persistent in-place animal query controls"
          git push origin HEAD:agent/global-animal-query
