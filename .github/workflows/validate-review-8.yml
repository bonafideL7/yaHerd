name: Validate review 8 session doses

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused fix
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/review8-preserve-session-doses.py

      - name: Validate architecture and Swift 6 build
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required for the iOS 26 target and Swift 6 concurrency gate." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            'yaHerd/Presentation/Views/Working/WorkingSessionAnimalWorkView+Actions.swift' \
            'yaHerdTests/WorkingTreatmentPlanReferenceTests.swift'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'yaHerd/Presentation/Views/Working/WorkingSessionAnimalWorkView+Actions.swift' \
            'yaHerdTests/WorkingTreatmentPlanReferenceTests.swift'
          git commit -m "Preserve session doses during treatment promotion"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
