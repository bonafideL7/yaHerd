name: Validate review 6 due-date seeding

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-due-date-seeding-v1
          fetch-depth: 0

      - name: Apply focused fix
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Scripts/apply-review-comment-6.py ]]; then
            python3 Scripts/apply-review-comment-6.py
            rm Scripts/apply-review-comment-6.py
          fi

      - name: Validate architecture and Swift 6 build
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required for the iOS 26 target and Swift 6 concurrency gate." >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          bash Scripts/verify-architecture.sh
          bash Scripts/verify-concurrency.sh

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            yaHerd/Presentation/Views/Working/WorkingSessionAnimalWorkView.swift \
            yaHerd/Presentation/Views/Working/WorkingSessionAnimalWorkView+Sections.swift \
            yaHerd/Presentation/Views/Working/WorkingSessionAnimalWorkView+Actions.swift \
            yaHerdTests/WorkingAnimalWorkTimestampTests.swift \
            Scripts/apply-review-comment-6.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserve saved pregnancy due dates while seeding"
          git push origin HEAD:agent/review-due-date-seeding-v1
